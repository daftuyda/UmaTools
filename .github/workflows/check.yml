name: Website checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt
      - run: npm run check
      - run: npm run build
      - run: npm run test:browser
      - run: npm run audit:responsive
