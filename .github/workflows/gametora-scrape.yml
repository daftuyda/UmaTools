name: Gametora Scrape

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gametora-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync Branch
        run: |
          git checkout -B "${GITHUB_REF_NAME}"
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Downloader Dependencies
        run: python -m pip install -r scripts/data/requirements-master.txt

      - name: Refresh GameTora
        id: gametora
        continue-on-error: true
        run: node scripts/data/refresh-provider.js gametora

      - name: Refresh GameWith
        id: gamewith
        continue-on-error: true
        run: node scripts/data/refresh-provider.js gamewith

      - name: Refresh Global Master
        id: master
        continue-on-error: true
        run: node scripts/data/refresh-provider.js master

      - name: Report Provider Failures
        if: steps.master.outcome == 'failure' || steps.gametora.outcome == 'failure' || steps.gamewith.outcome == 'failure'
        run: echo "::warning::A provider pipeline failed. Its previous validated files were retained; other providers can still publish."

      - name: Commit If Changed
        run: |
          git add -A public/assets/uma_data.json public/assets/support_card.json public/assets/support_hints.json public/assets/skills_all.json public/assets/skills_core.json public/assets/races.json public/assets/uma_skills.csv public/assets/uma_skills_jp.csv public/assets/accel_skills_compat.json public/assets/master public/assets/character_thumbs public/assets/support_thumbs
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update game data"
          git push

      - name: Fail When Every Provider Failed
        if: steps.master.outcome == 'failure' && steps.gametora.outcome == 'failure' && steps.gamewith.outcome == 'failure'
        run: exit 1
